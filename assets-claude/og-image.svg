<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TinTinLand · 全球 Web3 × AI 开发者社区">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E64145"/>
      <stop offset="46%" stop-color="#A233A8"/>
      <stop offset="100%" stop-color="#5F23F0"/>
    </linearGradient>
    <linearGradient id="brandTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E64145"/>
      <stop offset="46%" stop-color="#A233A8"/>
      <stop offset="100%" stop-color="#5F23F0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5F23F0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5F23F0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#08070C"/>

  <!-- top brand bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#brandTop)"/>

  <!-- decorative glow -->
  <circle cx="1050" cy="180" r="320" fill="url(#glow)"/>

  <!-- subtle grid -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="470" x2="1200" y2="470"/>
  </g>

  <!-- brand dots top-left -->
  <circle cx="100" cy="120" r="7" fill="#E64145"/>
  <circle cx="124" cy="120" r="7" fill="#A233A8"/>
  <circle cx="148" cy="120" r="7" fill="#5F23F0"/>

  <!-- wordmark -->
  <text x="100" y="290" font-family="Inter, 'Source Han Sans SC', 'Noto Sans SC', sans-serif" font-size="92" font-weight="800" fill="#FFFFFF" letter-spacing="-2">TinTinLand</text>

  <!-- underline accent -->
  <rect x="100" y="310" width="240" height="4" fill="url(#brand)" rx="2"/>

  <!-- tagline -->
  <text x="100" y="380" font-family="Inter, 'Source Han Sans SC', 'Noto Sans SC', sans-serif" font-size="34" font-weight="600" fill="#FFFFFF">全球 Web3 × AI 开发者社区</text>

  <!-- pillars -->
  <text x="100" y="500" font-family="Inter, 'Source Han Sans SC', 'Noto Sans SC', sans-serif" font-size="22" font-weight="500" fill="#9C97AB">课程 · 黑客松 · 企业服务 · Token Hub 渠道对接</text>

  <!-- metrics line -->
  <text x="100" y="540" font-family="Inter, 'Source Han Sans SC', 'Noto Sans SC', sans-serif" font-size="18" font-weight="400" fill="#6B667C">30 万+ 开发者 · 220+ 生态伙伴 · 800+ 孵化项目 · 2026 全面转向 AI</text>

  <!-- url bottom-right -->
  <text x="1100" y="580" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="18" font-weight="500" fill="#6B667C">tintinland.up.railway.app</text>
</svg>
