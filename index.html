<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>TinTinLand · 新官网 v2 (React + esbuild)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="src/styles/tokens.css">
  <link rel="stylesheet" href="src/styles/layout.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <link rel="stylesheet" href="src/styles/nav.css">
  <link rel="stylesheet" href="src/styles/console.css">
  <link rel="stylesheet" href="src/styles/modals.css">
  <link rel="stylesheet" href="src/styles/pages.css">

  <!--
    v1.2 全 ESM 化（spec §6.4 / §14.6）
    ------------------------------------------------------
    bundle.js 是 ES Module（type="module"），浏览器以 module 加载它。
    - 应用代码：esbuild --alias 把 'react' / '@privy-io/react-auth' / 'wagmi' / 'viem'
      等替换为完整 esm.sh URL，直接 fetch。
    - esm.sh 自己吐出的 shim（处理依赖树）可能含 bare import（如 `import React from "react"`），
      这些都走下面这个 importmap。
    单一 React 实例（来自 esm.sh/react@18）：bundled React 与 Privy 内部模块共享。
  -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react/jsx-dev-runtime": "https://esm.sh/react@18.3.1/jsx-dev-runtime"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <!--
    占位：start.sh 在容器启动前用 python3 替换 → <script>window.PB_ADMIN_DEMO_SECRET="...";</script>
    占位为空时（dev 模式没设 secret）→ 注释保留，frontend 不读 window.PB_ADMIN_DEMO_SECRET
  -->
  <!--INJECT:PB_ADMIN_DEMO_SECRET-->

  <!--
    占位 2：start.sh 注入 → window.PRIVY_APP_ID / window.PRIVY_CLIENT_ID / window.PRIVY_LOGIN_METHODS
    没设 PRIVY_APP_ID 时占位保留为注释 → PrivyProviderRoot 走 fallback（无 SDK OAuth 直连）
  -->
  <!--INJECT:PRIVY_CONFIG-->

  <!--
    v1.2：bundle.js 是 ES Module（--format=esm）。所有依赖（react / @privy-io/react-auth / viem / wagmi 等）
          已经由 esbuild 在 build 时通过 --alias:react=https://esm.sh/react@18
          把 'react' import 重写到 esm.sh URL，浏览器会直接 fetch。
          单一 React 实例；无 context 冲突（修 v1.2 上线后报的 "useContext null" 报错）。
  -->
  <script type="module" src="dist/bundle.js"></script>
</body>
</html>
