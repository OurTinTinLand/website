# ============================================================
# Railway 服务配置 · 单进程镜像（pocketbase + pb_public）
# ------------------------------------------------------------
# 单 Service 部署：
#   - pocketbase 自己 serve 静态文件（pb_public）+ API（/api/* + /_/*）
#   - 1 个 service = 1 个最小实例
#   - 浏览器同源调用，零网络配置
#
# Volume：
#   - Railway 不支持 Dockerfile 里的 VOLUME 指令
#   - 改成这里 [[deploy.volumes]] 声明
#   - /pb_data 在容器内挂到名为 "pb-data" 的 Railway Volume（持久化 PocketBase）
#   - mountPath 必须与 start.sh 里读取的目录一致：start.sh 解析顺序为
#     RAILWAY_VOLUME_MOUNT_PATH > PB_DATA > /pb_data，所以这里改 mountPath 时
#     也要改 PB_DATA（或让 RAILWAY_VOLUME_MOUNT_PATH 注入 = mountPath）
#   - 想用其它路径（如 /data）？把下面 mountPath 改成 "/data"，start.sh 会自动跟随
# ============================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/start.sh"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[deploy.volumes]]
mountPath = "/pb_data"
name = "pb-data"
