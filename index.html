<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>TinTinLand · 新官网 v2 (React + esbuild)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="src/styles/tokens.css">
  <link rel="stylesheet" href="src/styles/layout.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <link rel="stylesheet" href="src/styles/nav.css">
  <link rel="stylesheet" href="src/styles/console.css">
  <link rel="stylesheet" href="src/styles/modals.css">
  <link rel="stylesheet" href="src/styles/pages.css">

  <!-- React UMD（运行时由 window.React / window.ReactDOM 提供） -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
</head>
<body>
  <div id="root"></div>
  <!-- PocketBase base URL：dev (localhost:8090) 直连；prod 走当前 origin 的 /api 反代 -->
  <script>
    (function () {
      var pb = window.PB_URL;
      if (!pb) {
        var loc = window.location;
        // 本地开发：直接连 PB
        if (loc.hostname === "localhost" || loc.hostname === "127.0.0.1") {
          pb = "http://127.0.0.1:8090";
        } else {
          // 生产：默认同源（Node server.js 把 /api/* + /_/* 反代到容器内的 PB）
          pb = loc.origin;
        }
      }
      window.PB_URL = pb;
    })();
  </script>
  <script src="dist/bundle.js"></script>
</body>
</html>
