<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>TinTinLand · 新官网 v2 (React + esbuild)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="src/styles/tokens.css">
  <link rel="stylesheet" href="src/styles/layout.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <link rel="stylesheet" href="src/styles/nav.css">
  <link rel="stylesheet" href="src/styles/console.css">
  <link rel="stylesheet" href="src/styles/modals.css">
  <link rel="stylesheet" href="src/styles/pages.css">

  <!-- React UMD（运行时由 window.React / window.ReactDOM 提供） -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
</head>
<body>
  <div id="root"></div>
  <!--
    占位：PB onServe 钩子（backend/pb_hooks/inject_secrets.pb.js）会在 HTML 响应
    阶段把下面这个注释替换成：
      <script>window.PB_ADMIN_DEMO_SECRET="...";</script>
    供前端 demo admin 流使用。
    占位为空时钩子什么也不注入（demo admin 自动 401）。
  -->
  <!--INJECT:PB_ADMIN_DEMO_SECRET-->

  <!--
    占位 2：start.sh 在容器启动前把这段注释替换成：
      <script>
        window.PRIVY_APP_ID="...";
        window.PRIVY_CLIENT_ID="...";
        window.PRIVY_LOGIN_METHODS="email,google,x,github,discord,wallet";
      </script>
    供前端 PrivyProvider 初始化使用。
    没设置 PRIVY_APP_ID 时占位保留为注释 → 前端自动走"无 SDK 兜底"（OAuth 直连）。
  -->
  <!--INJECT:PRIVY_CONFIG-->

  <script src="dist/bundle.js"></script>
</body>
</html>
