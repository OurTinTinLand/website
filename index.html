<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>TinTinLand · 新官网 v2 (React + esbuild)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="src/styles/tokens.css">
  <link rel="stylesheet" href="src/styles/layout.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <link rel="stylesheet" href="src/styles/nav.css">
  <link rel="stylesheet" href="src/styles/console.css">
  <link rel="stylesheet" href="src/styles/modals.css">
  <link rel="stylesheet" href="src/styles/pages.css">

  <!-- React UMD（运行时由 window.React / window.ReactDOM 提供） -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!--
    Privy SDK 浏览器侧动态加载（spec §6.4）
    ----------------------------------------------------------------------
    PrivyProviderRoot 里用 Function('s','return import(s)')() 的方式动态 import，
    这样 esbuild 不在 build time 强制解析（避免沙盒/无 SDK 部署时构建失败）。

    浏览器裸 specifier（如 '@privy-io/react-auth'）需要 importmap 解析到完整 URL；
    我们把这条映射指到 esm.sh — 它会自动 assemble 整个 dep 子树
    （@privy-io/api-base / popup / wagmi / viem / @solana/kit 等）一并吐回。

    版本固定 ^3.35.0 与 package.json optionalDependencies 对齐；>= Chrome 89 / Safari 16.4 / Firefox 108 都支持 importmap。
    不支持 importmap 的老浏览器 → dynamic import 报错 → 走 catch → PrivyStandaloneLogin fallback。
  -->
  <script type="importmap">
  {
    "imports": {
      "@privy-io/react-auth": "https://esm.sh/@privy-io/react-auth@^3.35.0",
      "react": "https://esm.sh/react@18.3.1",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <!--
    占位：PB onServe 钩子（backend/pb_hooks/inject_secrets.pb.js）会在 HTML 响应
    阶段把下面这个注释替换成：
      <script>window.PB_ADMIN_DEMO_SECRET="...";</script>
    供前端 demo admin 流使用。
    占位为空时钩子什么也不注入（demo admin 自动 401）。
  -->
  <!--INJECT:PB_ADMIN_DEMO_SECRET-->

  <!--
    占位 2：start.sh 在容器启动前把这段注释替换成：
      <script>
        window.PRIVY_APP_ID="...";
        window.PRIVY_CLIENT_ID="...";
        window.PRIVY_LOGIN_METHODS="email,google,x,github,discord,wallet";
      </script>
    供前端 PrivyProvider 初始化使用。
    没设置 PRIVY_APP_ID 时占位保留为注释 → 前端自动走"无 SDK 兜底"（OAuth 直连）。
  -->
  <!--INJECT:PRIVY_CONFIG-->

  <script src="dist/bundle.js"></script>
</body>
</html>
