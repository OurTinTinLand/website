  <!--
    v1.3 全本地化（spec §6.4 / §14.6）
    bundle.js 是 ES Module（type="module"），浏览器以 module 加载。
    所有依赖（react / react-dom / @privy-io/react-auth / wagmi / viem / zustand /
    @wagmi/connectors / @solana/kit）由 esbuild 在 build 时从 node_modules 打进 bundle.js。
    生产环境零 esm.sh 运行时请求；Privy 全栈本地化，单一 React 实例无 context 冲突。
  -->
</head>
<body>
  <div id="root"></div>
  <!--
    占位：start.sh 在容器启动前用 python3 替换 → <script>window.PB_ADMIN_DEMO_SECRET="...";</script>
    占位为空时（dev 模式没设 secret）→ 注释保留，frontend 不读 window.PB_ADMIN_DEMO_SECRET
  -->
  <!--INJECT:PB_ADMIN_DEMO_SECRET-->

  <!--
    占位 2：start.sh 注入 → window.PRIVY_APP_ID / window.PRIVY_CLIENT_ID / window.PRIVY_LOGIN_METHODS
    没设 PRIVY_APP_ID 时占位保留为注释 → PrivyProviderRoot 不挂载 PrivyProvider，登录按钮静默无响应
  -->
  <!--INJECT:PRIVY_CONFIG-->

  <!--
    v1.3：bundle.js 是 ES Module（--format=esm）。所有依赖已经从 node_modules 打进 bundle.js。
          单一 React 实例；无 context 冲突。
  -->
  <script type="module" src="dist/bundle.js"></script>
</body>
