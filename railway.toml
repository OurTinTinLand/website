# ============================================================
# Railway 服务配置 · 推荐用统一镜像（前端 + PB）
# ------------------------------------------------------------
# 单 Service 部署：
#   - Web + 后端 PB 共容器、单 PORT（Railway 注入）
#   - 省钱：1 个 service = 1 个最小实例
#   - 省事：内部走 localhost，零网络配置
#
# 切到分离部署：把 dockerfilePath 改成 "Dockerfile.frontend"，
#   然后另起一个 service 用 Dockerfile.backend + railway.backend.toml
# ============================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/start.sh"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
